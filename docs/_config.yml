# GitHub Pages builds this directory: docs/ is the site root, every .md
# beside this file is a page, and the result is
# https://jostraca.github.io/jostraca/. It is the same documentation set
# jostraca.org renders and the same files a reader browses on GitHub -- no
# second copy, so a correction here is live in all three places.
#
# Settings only, deliberately. The behaviour these pages already rely on
# comes from the plugins GitHub Pages runs by default:
# jekyll-optional-front-matter renders a page that has no frontmatter (most
# of them), jekyll-relative-links turns a link to `tutorial.md` into
# `tutorial.html`, and jekyll-titles-from-headings takes each page's title
# from its H1. Adding a `plugins:` key here risks changing that set, and
# nothing on this site needs one.
#
# Links out of docs/ are absolute, because Jekyll serves this directory as
# the site root: `../ts/` resolves above it and 404s on the rendered site
# while working perfectly in the GitHub blob view, which is exactly the kind
# of breakage that goes unnoticed.

# docs/design/ is working material -- plans and the review log -- and this
# directory is the Pages SITE ROOT, so without this line Jekyll would
# render 3,169 lines of internal analysis as public pages at
# /design/PARITY_PLAN.html and friends. They live here for one-directory
# tidiness, not to be published.
exclude:
  - design

title: Jostraca documentation

# Two lengths, because the theme uses them for different jobs: `tagline`
# finishes the home page's <title>, while `description` is the meta
# description a search result shows. Without a tagline the theme reaches for
# the description and the home page ends up with a 150-character title.
tagline: A code generator you can run twice
description: >-
  A code generator you can run twice: components in, a file tree out, and a
  second run that can preserve, present, diff or merge over code a human
  edited in between.

theme: jekyll-theme-primer
show_downloads: false
