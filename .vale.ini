# Prose gate. Runs over docs/ in CI; see .github/workflows/docs.yml and
# docs/STYLE-GUIDE.md.
#
# Precedence, decided deliberately and recorded in the style guide:
#
#   house voice  ->  Google  ->  Vale defaults
#
# Google (developers.google.com/style) is the base for everything the
# house guide is silent on. Where the two collide the house voice wins,
# and every such override is listed below with its reason, so a reader
# who wonders why a Google rule is off finds the answer here rather than
# guessing it is an oversight.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Jostraca
# PINNED BY URL, not by name. `Packages = Google` resolves to whatever
# the package registry serves at sync time, so a Google release could
# add or change an error-level rule and turn an unrelated docs pull
# request red -- exactly the nondeterminism pinning the BINARY was
# supposed to prevent. Pinning one without the other prevented half of
# it.
#
# v0.7.1 is the release every count in this file was measured against;
# verified byte-identical to what `Packages = Google` fetched.
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip

[*.md]
BasedOnStyles = Vale, Google, Jostraca

# The READMEs are in scope too: the style guide is normative for them,
# and they are the first prose most readers see (npm renders ts/, GitHub
# renders the root). PARITY_PLAN.md and the port notes are working
# documents for maintainers, not documentation, and are not linted.

# Documentation must not CITE those working documents either. A link out
# of a docs page into a plan or a decision record strands the reader in
# material written for somebody else and revised on somebody else's
# schedule. That rule is docs.test.ts `no-internal-doc-references`, not a
# Vale rule, because the file sets differ: Vale lints adr/, where citing
# the analysis a decision came from is exactly right.

# --- Overrides where the house voice wins ------------------------------
#
# The register is Richard Rodger's blog voice, not neutral vendor docs.
# These four rules encode Google's house style, not correctness, and
# each one would flatten a voice choice the guide makes on purpose.

# "We" is allowed in TUTORIALS ONLY, where the page walks through code
# with the reader (STYLE-GUIDE.md, voice rule 7). Vale cannot express
# "only in tutorials", so the rule is off here and the restriction is
# carried by docs.test.ts `we-appears-only-in-tutorials`, which knows
# which page is which.
Google.We = NO

# "I" appears nowhere in the docs by house rule, which is STRICTER than
# Google's. docs.test.ts `first-person-singular-appears-nowhere` covers
# it, including `my` and `mine`; this rule also fires on "me" inside
# quoted CLI output, so it is off here.
#
# Both of those tests were written BECAUSE these two lines were here
# first, claiming an enforcement that did not exist. Switching a Google
# rule off in favour of a house rule means the house rule has to be
# real: the named test is the receipt, and the first run of
# `first-person-singular-appears-nowhere` found two violations in
# explanation.md that both gates had been blind to.
Google.FirstPerson = NO

# The house voice alternates long explanatory sentences with short
# verdicts, and the occasional passive is how a sentence keeps its
# subject on the thing being documented ("the file is overwritten").
# 254 hits, almost all of them fine. Advisory only, never a gate.
Google.Passive = suggestion

# Contractions are a register choice per document kind, not a rule:
# tutorials contract, reference pages do not. 190 hits, none of them
# defects. Advisory only.
Google.Contractions = suggestion

# --- The gate ----------------------------------------------------------
#
# Everything below is error-level and fails CI. These are the Google
# rules that carry no voice cost: they are conventions a reader benefits
# from and an author has no reason to vary.
Google.EmDash = error
Google.OxfordComma = error
Google.Anthropomorphism = error
Google.ExcessiveClaims = error
Google.Spelling = error

# --- Demoted on evidence, not on taste --------------------------------
#
# Each of these was tried at error level against the real pages first.
# They are warnings because they were WRONG here, not because they were
# inconvenient; the count is what each produced on a clean run.

# Maps `touch` to `tap` -- a mobile-UI rule, and 9 of its 22 hits were
# docs discussing touching a FILE. The three substitutions from this
# rule that do hold are carried at error level by Jostraca.WordChoice.
Google.WordListCase = warning

# Wants NUL, POSIX, ISO, TSV and FFFD spelled out. The audience is
# people writing code generators; padding the prose with "Portable
# Operating System Interface" would serve nobody. 11 hits, all of them
# standard terms for this reader.
Google.Acronyms = warning

# Flags "Call Jostraca from Go" and "Reference: the Go port" as not
# sentence case. Both ARE sentence case; the rule cannot know that
# Jostraca and Go are proper nouns. 2 hits, both false.
Google.Headings = warning

# US convention: commas and periods INSIDE the quotation marks. The
# house voice is not US English -- the same call as the -ise spellings
# in accept.txt -- and putting a period inside a quoted `code span` is
# actively wrong when the quote is a literal.
Google.Quotes = warning

# "Use parentheses judiciously" is advice, not a rule, and the house
# guide already rations them more precisely than this can (voice rule
# 4: definitions, caveats, and at most one dry aside per page).
Google.Parens = warning

# Flags an `-ly` adverb before a hyphen ("newly-created"), which is a real
# error class -- but it cannot tell an adverb from a word that merely ends
# in those two letters. `supply-chain` trips it, as would family-, early-,
# only- and reply-. Measured before demoting, per the standard above: 0 hits
# across docs/ and both READMEs, against 3 false positives in the first new
# prose written after the gate existed (adr/0002).
Google.LyHyphens = warning

Google.Semicolons = warning
Google.Will = warning
