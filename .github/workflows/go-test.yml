name: Go tests

# ts/** is included deliberately: the parity suite exists to catch the Go
# port drifting from canonical TS behaviour, so a TS-only change is exactly
# the event that must run this job.
#
# `push` is scoped to master, matching test.yml. Without that scope a branch
# push and its pull_request both trigger, so every job here -- corpus, the
# whole OS matrix, lint -- ran twice on every PR commit. Branch coverage is
# not lost: the pull_request event covers a branch from the moment a PR is
# open, which is when the result is worth reading.
on:
  push:
    branches: [master]
    paths:
      - 'go/**'
      - 'ts/**'
      - '.github/workflows/go-test.yml'
  pull_request:
    branches: [master]
    paths:
      - 'go/**'
      - 'ts/**'
      - '.github/workflows/go-test.yml'

jobs:
  # The freshness gate: regenerate the committed parity corpora from
  # canonical TS and fail on any diff, so TS changes cannot silently leave
  # the Go expectations stale.
  #
  # Deliberately NOT part of the OS matrix. This is a canonical-source
  # check, not a platform check, and running it on Windows would fail for
  # reasons that say nothing about the port: ts/tools/scenario-corpus.js
  # strips the machine prefix with `process.cwd() + '/'`, but memfs
  # forward-slashes and drive-strips its volume keys, so on Windows the
  # prefix never matches and the paths come out machine-specific.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Regenerate parity corpus from TS
        working-directory: ts
        run: |
          npm install
          npm run build
          node tools/extract-parity.js ../go/testdata/parity
      - name: Parity corpus is up to date
        run: |
          if ! git diff --exit-code -- go/testdata/parity; then
            echo "::error::go/testdata/parity is stale. Run 'node tools/extract-parity.js ../go/testdata/parity' from ts/ and commit the result."
            exit 1
          fi

  # The port's behaviour, on every platform it claims to support.
  #
  # This is the gate issue #22 was about: `GOOS=windows go vet` compiles the
  # Windows build but never executes it, so three Windows-only defects in a
  # single review round were all found by reading rather than by CI.
  #
  # Consumes the committed corpora rather than regenerating them, which is
  # what makes it deterministic across platforms.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: go
        # windows-latest defaults `run:` to pwsh, which cannot parse the
        # POSIX syntax these steps use.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          # The module is in go/, not at the repo root, and an action does
          # not inherit the job's working-directory — so setup-go looked for
          # go.mod beside the checkout, found none, and warned "Restore cache
          # failed" on every leg of the matrix. Point it at the real module.
          cache-dependency-path: go/go.sum

      - run: go build ./...
      - run: go vet ./...

      # -race needs cgo and a C toolchain. Linux and macOS runners have one;
      # if the Windows leg ever fails at link time, drop -race there rather
      # than dropping the step.
      - run: go test ./... -race -count=1

      - name: Concurrency stress (10 iterations)
        run: go test ./... -run TestGenerateConcurrent -race -count=10

      # The three differential corpora. Byte-equality with canonical TS has
      # to hold on every platform, not just the one that generated them —
      # separator handling is exactly what would break it.
      - name: Parity snapshots vs TS
        run: go test ./... -run TestParity -count=1 -v
      - name: Diff engine matches TS byte-for-byte
        run: go test ./... -run TestDiffCorpus -count=1 -v
      - name: Template engine matches TS byte-for-byte
        run: go test ./... -run TestTemplateCorpusMatchesTS -count=1 -v
      - name: Option surface matches TS byte-for-byte
        run: go test ./... -run TestScenarioCorpusMatchesTS -count=1 -v

  # Everything that is about the source rather than the platform. Linux
  # only, because running it three times would tell us the same thing three
  # times.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          # The module is in go/, not at the repo root, and an action does
          # not inherit the job's working-directory — so setup-go looked for
          # go.mod beside the checkout, found none, and warned "Restore cache
          # failed" on every leg of the matrix. Point it at the real module.
          cache-dependency-path: go/go.sum

      # Cross-compilation still earns its place next to the matrix above:
      # it catches build breakage on platforms without a runner, and it is
      # cheap. It just cannot catch behaviour — hence the matrix.
      - run: GOOS=darwin go vet ./...
      - run: GOOS=windows go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed: $unformatted"
            exit 1
          fi

      # A short soak per target. The seed corpus already runs under
      # `go test`; this is what finds the next seed. A failure writes the
      # input to testdata/fuzz — commit it.
      - name: Fuzz the engines (20s per target)
        run: |
          for t in FuzzMerge FuzzDiff FuzzLines FuzzLCS FuzzTemplate; do
            echo "== $t"
            go test -run "$t" -fuzz "^$t$" -fuzztime 20s ./...
          done
      - name: Diff engine coverage is 100%
        run: ./check_diff_coverage.sh
